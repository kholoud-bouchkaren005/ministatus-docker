git
name: Docker CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ministatus

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint du Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build de l'image
        run: docker build --build-arg APP_VERSION=ci -t ${{ env.IMAGE }}:ci .

      - name: Tests dans le conteneur
        run: docker run --rm ${{ env.IMAGE }}:ci python -m unittest -v

      - name: Rapport Trivy (JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Rapport HTML (genere depuis le JSON)
        if: always()
        run: |
          python3 - <<'PY'
          import json, html
          d = json.load(open("trivy-report.json"))
          rows = []
          for r in d.get("Results", []):
              for v in r.get("Vulnerabilities") or []:
                  rows.append((v.get("Severity", ""), r.get("Target", ""),
                               v.get("PkgName", ""), v.get("VulnerabilityID", ""),
                               v.get("InstalledVersion", ""), v.get("FixedVersion", "")))
          order = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3}
          rows.sort(key=lambda x: order.get(x[0], 9))
          colors = {"CRITICAL": "#fecaca", "HIGH": "#fed7aa", "MEDIUM": "#fef08a", "LOW": "#e2e8f0"}
          out = ["<html><head><meta charset='utf-8'><title>Rapport Trivy</title>",
                 "<style>body{font-family:Arial;margin:20px}table{border-collapse:collapse;width:100%}",
                 "td,th{border:1px solid #94a3b8;padding:4px 8px;font-size:13px}",
                 "th{background:#dbeafe}</style></head><body>",
                 "<h1>Rapport Trivy - ministatus:ci</h1>",
                 "<p>Total : %d vulnerabilites</p>" % len(rows),
                 "<table><tr><th>Gravite</th><th>Cible</th><th>Paquet</th><th>CVE</th>",
                 "<th>Version installee</th><th>Version corrigee</th></tr>"]
          for sev, tgt, pkg, cve, ins, fix in rows:
              c = colors.get(sev, "#fff")
              cells = "".join("<td>%s</td>" % html.escape(x or "-") for x in (tgt, pkg, cve, ins, fix))
              out.append("<tr><td style='background:%s'><b>%s</b></td>%s</tr>" % (c, html.escape(sev), cells))
          out.append("</table></body></html>")
          open("trivy-report.html", "w", encoding="utf-8").write("\n".join(out))
          PY

      - name: Resume dans la page du run
        if: always()
        run: |
          echo "### Rapport Trivy" >> "$GITHUB_STEP_SUMMARY"
          Q='[.Results[]?.Vulnerabilities[]? | select(.Severity==$s)] | length'
          for s in CRITICAL HIGH MEDIUM; do
            n=$(jq --arg s "$s" "$Q" trivy-report.json)
            echo "- $s : $n" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-report.*

      - name: Quality gate (HIGH et CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: library
          ignore-unfixed: true
          exit-code: "1"